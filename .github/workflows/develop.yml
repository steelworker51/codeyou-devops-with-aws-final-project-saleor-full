name: Develop Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  IMAGE_NAME: charlie1979/saleor-api
  IMAGE_TAG: develop

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pip-audit poetry==1.8.4 poetry-plugin-export

      - name: Run Ruff
        continue-on-error: true
        working-directory: saleor-api
        run: ruff check .

      - name: Export dependencies
        working-directory: saleor-api
        run: |
          poetry export \
            --without-hashes \
            --format requirements.txt \
            --output requirements-audit.txt

      - name: Run dependency audit
        continue-on-error: true
        working-directory: saleor-api
        run: pip-audit -r requirements-audit.txt

      - name: Build Saleor API image
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" ./saleor-api

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: charlie1979/saleor-api:develop
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: charlie1979
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push develop image
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"