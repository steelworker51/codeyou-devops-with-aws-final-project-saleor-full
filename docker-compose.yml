services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: saleor
      POSTGRES_USER: saleor
      POSTGRES_PASSWORD: saleor
    volumes:
      - saleor-db:/var/lib/postgresql/data
      - ./replica_user.sql:/docker-entrypoint-initdb.d/replica_user.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U saleor -d saleor
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - saleor-backend-tier

  redis:
    image: redis:7-alpine
    volumes:
      - saleor-redis:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - saleor-backend-tier

  web:
    build:
      context: ./saleor-api
      dockerfile: Dockerfile
    image: charlie1979/saleor-api:production
    env_file:
      - backend.env
      - common.env
    environment:
      DATABASE_URL: postgres://saleor:saleor@db:5432/saleor
      CELERY_BROKER_URL: redis://redis:6379/1
      EMAIL_URL: smtp://mailpit:1025
      ALLOWED_HOSTS: "*"
      DEBUG: "True"
    ports:
      - "8000:8000"
    volumes:
      - saleor-media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8000/graphql/', timeout=5)"
          || exit 1
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - saleor-backend-tier

  dashboard:
    image: ghcr.io/saleor/saleor-dashboard:3.21
    ports:
      - "9000:80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --tries=1 --spider http://localhost/ || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - saleor-backend-tier

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - saleor-backend-tier

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - saleor-backend-tier

networks:
  saleor-backend-tier:
    driver: bridge

volumes:
  saleor-db:
  saleor-redis:
  saleor-media: